
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <title>WukongJS Chess</title>

  <!-- Bootstrap -->
  <link
    rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
  >

  <!-- Chessboard.js -->
  <link rel="stylesheet" href="chessboard-1.0.0.min.css">

  <!-- Custom responsive styles -->
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #f4f6f8;
      color: #212529;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Main container */
    .chess-app {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* Chessboard */
    #chessboard {
      width: 100%;
      max-width: 400px;
      margin: 0 auto 16px;
    }

    /* Controls: always one row, any number of buttons */
    .game-controls {
      display: flex;
      flex-flow: row nowrap;
      align-items: stretch;
      gap: 6px;
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .game-controls .btn {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      min-height: 44px;
      padding: 8px 2px;
      font-size: clamp(9px, 3vw, 14px);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-radius: 7px;
    }
    
    /* Buttons: animate on click without changing colors */
    .game-controls .btn {
      transition: transform 0.1s ease !important;
      -webkit-tap-highlight-color: transparent;
    }

    /* Keep colors unchanged on hover, focus, and click */
    .game-controls .btn:hover,
    .game-controls .btn:focus,
    .game-controls .btn:active,
    .game-controls .btn:focus:active {
      color: inherit !important;
      background-color: transparent !important;
      border-color: inherit !important;
      box-shadow: none !important;
    }

    /* Press animation */
    .game-controls .btn:active {
      transform: scale(0.95);
    }

    /* Remove default focus outline */
    .game-controls .btn:focus {
      outline: none !important;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .chess-app {
        padding: 16px 10px;
      }

      .chess-header {
        margin-bottom: 16px;
      }

      #chessboard {
        max-width: 100%;
        margin-bottom: 14px;
      }

      .game-controls {
        gap: 4px;
      }

      .game-controls .btn {
        min-height: 44px;
        padding: 7px 1px;
        font-size: clamp(8px, 2.8vw, 13px);
      }
    }

    /* Very narrow phones */
    @media (max-width: 320px) {
      .chess-app {
        padding: 12px 6px;
      }

      .game-controls {
        gap: 2px;
      }

      .game-controls .btn {
        padding: 6px 0;
        font-size: 8px;
      }
    }

    /* Desktop and tablets */
    @media (min-width: 768px) {
      .chess-app {
        padding-top: 40px;
      }
    }
  </style>

  <!-- JavaScript dependencies -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="chessboard-1.0.0.min.js"></script>
  <script src="wukong.js"></script>
</head>

<body>
  <main class="chess-app">

    <!-- Chessboard -->
    <div id="chessboard"></div>

    <!-- Game controls -->
    <div class="game-controls">
      <button id="newgame" class="btn btn-outline-secondary">
        New
      </button>

      <button id="makemove" class="btn btn-outline-secondary">
        Move
      </button>

      <button id="takeback" class="btn btn-outline-secondary">
        Undo
      </button>

      <button id="edit" class="btn btn-outline-secondary">
        Edit
      </button>

      <button id="flipboard" class="btn btn-outline-secondary">
        Flip
      </button>

    </div>

  </main>

  <script>
    /******************************
     * INITIALIZATION
     ******************************/

    const engine = new Engine();

    const config = {
      draggable: true,
      position: 'start',
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    };

    const board = Chessboard('chessboard', config);

    let engineMovePending = false;
    let gameGeneration = 0;
    let editMode = 0;


    /******************************
     * BUTTON HANDLERS
     ******************************/

    $('#newgame').on('click', function () {
      // Invalidate any previously scheduled engine response.
      gameGeneration++;
      engineMovePending = false;

      engine.setBoard(engine.START_FEN);
      board.position('start');
    });

    $('#makemove').on('click', function () {
      makeMove();
    });

    $('#takeback').on('click', function () {
      if (engineMovePending) return;
      engine.takeBack();
      board.position(engine.generateFen());
    });
    
    $('#edit').on('click', function () {
      editMode ^= 1;
    });

    $('#flipboard').on('click', function () {
      board.flip();
    });


    /******************************
     * ENGINE MOVE
     ******************************/

    function makeMove() {
      if (engineMovePending) return;

      engineMovePending = true;
      const currentGeneration = gameGeneration;

      setTimeout(function () {
        try {
          // Stop if a new game was started.
          if (currentGeneration !== gameGeneration) return;

          const bestMove = engine.searchTime(1000);

          if (
            currentGeneration === gameGeneration &&
            bestMove
          ) {
            engine.makeMove(bestMove);
            board.position(engine.generateFen());
          }
        } catch (error) {
          console.error('Engine move failed:', error);
        } finally {
          if (currentGeneration === gameGeneration) {
            engineMovePending = false;
          }
        }
      }, 100);
    }


    /******************************
     * PLAYER MOVE
     ******************************/

    function onDrop(source, target) {
      if (engineMovePending) {
        return 'snapback';
      }

      // Queen promotion.
      const promotedPiece = engine.getSide() ? 11 : 5;

      const moveString =
        source +
        target +
        engine.promotedToString(promotedPiece);

      const move = engine.moveFromString(moveString);

      if (!move) {
        return 'snapback';
      }

      const legalMoves = engine.generateLegalMoves();

      const isLegal = legalMoves.some(function (legalMove) {
        return legalMove.move === move;
      });

      if (!isLegal) {
        alert("illegal");
        return 'snapback';
      }

      engine.makeMove(move);
      if (!editMode) makeMove();
    }


    /******************************
     * BOARD SYNCHRONIZATION
     ******************************/

    function onSnapEnd() {
      board.position(engine.generateFen());
    }


    /******************************
     * RESPONSIVE RESIZING
     ******************************/

    let resizeTimeout;

    window.addEventListener('resize', function () {
      clearTimeout(resizeTimeout);

      resizeTimeout = setTimeout(function () {
        board.resize();
      }, 100);
    });

    window.addEventListener('orientationchange', function () {
      setTimeout(function () {
        board.resize();
      }, 200);
    });
    
    // Disable pinch-to-zoom on touch devices.
    document.addEventListener('touchmove', function (event) {
      if (event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    // Disable Safari gesture zoom.
    document.addEventListener('gesturestart', function (event) {
      event.preventDefault();
    });

    document.addEventListener('gesturechange', function (event) {
      event.preventDefault();
    });

    document.addEventListener('gestureend', function (event) {
      event.preventDefault();
    });
  </script>
</body>
</html>
